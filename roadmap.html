<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SkillVault - Career Roadmap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root{
      --bg-primary: #ffffff;
      --bg-secondary: #f7f9fc;
      --bg-tertiary: #f0f5ff;
      --border-color: #e6eef9;
      --text-primary: #0f1724;
      --text-secondary: #64748b;
      --accent-primary: #0066ff;
      --accent-secondary: #00b7ff;
      --accent-tertiary: rgba(0,102,255,0.08);
      --transition: all 0.18s ease;
      --modal-z: 1200;
    }
    html.dark-theme{
      --bg-primary: #0b1020;
      --bg-secondary: #071226;
      --bg-tertiary: #052033;
      --border-color: #122039;
      --text-primary: #e6eef9;
      --text-secondary: #9fb0c8;
      --accent-primary: #44a1ff;
      --accent-secondary: #6ce0ff;
      --accent-tertiary: rgba(100,160,255,0.08);
    }
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg-secondary); color:var(--text-primary);transition:var(--transition);}
    
    /* Header */
    .header{padding:1rem 0;background-color:var(--bg-secondary);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:1000;}
    .header-content{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
    .logo{display:flex;align-items:center;gap:.5rem}
    .logo i{font-size:1.45rem;color:var(--accent-primary)}
    .logo h1{margin:0;font-size:1.75rem;font-weight:700;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .header-actions{display:flex;gap:.5rem}
    .header-actions button{background:transparent;border:1px solid var(--border-color);padding:.5rem;border-radius:.5rem;cursor:pointer;color:var(--text-primary);transition:var(--transition);font-size:1.125rem;display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem}
    .header-actions button:hover{background:var(--bg-tertiary);color:var(--accent-primary)}
    
    .main-container{max-width:1100px;margin:2rem auto;padding:0 1rem 4rem}
    .roadmap-header {display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem;padding-bottom:2rem;border-bottom:2px solid var(--border-color);}
    .back-btn {display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background-color:var(--bg-secondary);border:1px solid var(--border-color);border-radius:0.5rem;text-decoration:none;color:var(--text-primary);transition:var(--transition);cursor:pointer}
    .back-btn:hover{background-color:var(--bg-tertiary)}
    .roadmap-header h2 {font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;flex:1;margin:0}
    .timeline-section,.skills-section,.resources-section{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:1rem;padding:2rem;margin-bottom:2rem;}
    .section-title{font-size:1.25rem;font-weight:700;margin-bottom:1rem;color:var(--text-primary)}
    .timeline{position:relative;}
    .timeline-item{margin-bottom:1.25rem;position:relative;}
    .timeline-content{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:.75rem;padding:1rem}
    .timeline-month{font-size:.9rem;color:var(--accent-primary);font-weight:600;text-transform:uppercase;margin-bottom:.25rem}
    .timeline-title{font-weight:700;margin-bottom:.5rem;color:var(--text-primary);font-size:1.09rem;}
    .timeline-description{color:var(--text-secondary);font-size:.96rem;margin-bottom:.5rem}
    .timeline-topic{background:var(--accent-tertiary);color:var(--accent-primary);padding:.24rem .5rem;border-radius:999px;font-weight:600;font-size:.82rem;margin:2px;display:inline-block}
    .skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;}
    .skill-card{background:var(--bg-secondary);padding:1rem;border:1px solid var(--border-color);border-radius:.75rem;text-align:center;transition:var(--transition)}
    .skill-card:hover{border-color:var(--accent-primary);background:var(--bg-tertiary)}
    .skill-icon{font-size:1.7rem;color:var(--accent-primary);margin-bottom:.55rem;}
    .skill-name{font-weight:700;color:var(--text-primary)}
    .skill-level{color:var(--text-secondary);font-size:.94rem;margin-bottom:.45rem}
    .resources-list{display:flex;flex-direction:column;gap:.75rem}
    .resource-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg-secondary);padding:.85rem 1rem;border-radius:.6rem;border:1px solid var(--border-color);transition:var(--transition)}
    .resource-item:hover{border-color:var(--accent-primary);background:var(--bg-tertiary)}
    .resource-info{flex:1}
    .resource-title{font-weight:700;color:var(--text-primary);margin-bottom:.12rem}
    .resource-title a{color:var(--accent-primary);text-decoration:underline;transition:var(--transition)}
    .resource-title a:hover{color:var(--accent-secondary)}
    .resource-description{color:var(--text-secondary);font-size:.97rem;margin-bottom:.4rem}
    .resource-meta{font-size:.88rem;color:var(--text-secondary)}
    .roadmap-actions{display:flex;gap:1rem;justify-content:center;margin-top:2rem;}
    .action-btn{padding:.6rem 1.2rem;border-radius:.65rem;border:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;font-size:1.05rem;transition:var(--transition);text-decoration:none}
    .primary-btn{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:white}
    .primary-btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,102,255,0.2)}
    .secondary-btn{background:var(--bg-secondary);border:1px solid var(--accent-primary);color:var(--accent-primary)}
    .secondary-btn:hover{background:var(--accent-tertiary)}
    .toast{position:fixed;right:1rem;bottom:1rem;background:rgba(12,20,40,0.9);color:#fff;padding:.6rem .9rem;border-radius:.5rem;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .3s, transform .3s;z-index:2001}
    .toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:768px){
      .header-content{padding:0 0.5rem}
      .logo h1{font-size:1.25rem}
      .skills-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
      .roadmap-actions{flex-direction:column}
      .action-btn{width:100%}
    }
    .resource-link {display: none !important;}
  </style>
</head>
<body>
  <!-- Header with theme toggle -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-vault"></i>
        <h1>SkillVault</h1>
      </div>
      <div class="header-actions">
        <button id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="roadmap-header">
      <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
      <h2 id="roadmapTitle">Career Roadmap</h2>
      <div style="width:80px"></div>
    </div>
    <div class="timeline-section">
      <h3 class="section-title">Your Learning Journey</h3>
      <div id="timeline" class="timeline"></div>
    </div>
    <div class="skills-section">
      <h3 class="section-title">Key Skills to Master</h3>
      <div id="skillsGrid" class="skills-grid"></div>
    </div>
    <div class="resources-section">
      <h3 class="section-title">Learning Resources</h3>
      <div id="resourcesList" class="resources-list"></div>
    </div>
    <div class="roadmap-actions">
      <a href="portfolio.html" class="action-btn primary-btn"><i class="fas fa-arrow-right"></i> Build Portfolio</a>
    </div>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    // ===== THEME INITIALIZATION AND TOGGLE =====
    function initThemeFromStorage() {
      const saved = localStorage.getItem('skillvault-theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark-theme');
      } else {
        document.documentElement.classList.remove('dark-theme');
      }
    }

    // Initialize theme immediately
    initThemeFromStorage();

    // Theme toggle function
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark-theme');
      localStorage.setItem('skillvault-theme', isDark ? 'dark' : 'light');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) {
        const icon = themeBtn.querySelector('i');
        if (icon) {
          icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
      }
      showToast(isDark ? '🌙 Dark Mode' : '☀️ Light Mode');
    }

    // Toast function
    function showToast(msg, duration = 2200) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._toastTimer);
      toast._toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Setup theme toggle button
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        // Update icon based on current theme
        const isDark = document.documentElement.classList.contains('dark-theme');
        const icon = themeToggle.querySelector('i');
        if (icon) {
          icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        // Add click event
        themeToggle.addEventListener('click', toggleTheme);
      }
    });

    // ===== ROADMAP API AND RENDERING =====
    async function fetchAIRoadmap(goal) {
      const res = await fetch("http://localhost:5000/generate-roadmap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jobTitle: goal })
      });
      if (!res.ok) return null;
      return await res.json();
    }

    const roadmapApp = {
      goal: null,
      async init() {
        this.goal = localStorage.getItem("skillvault-goal") || "Frontend Developer";
        document.getElementById("roadmapTitle").textContent = `Roadmap for ${this.goal}`;
        const data = await fetchAIRoadmap(this.goal);
        window.lastApiResponse = data;
        if (!data || !Array.isArray(data.phases)) {
          document.getElementById("timeline").innerHTML = "<b>No data loaded</b>";
          document.getElementById("skillsGrid").innerHTML = "<b>No data loaded</b>";
          document.getElementById("resourcesList").innerHTML = "<b>No data loaded</b>";
          return;
        }
        this.renderTimeline(data.phases);
        this.renderSkills(data.phases);
        this.renderResources(data.phases, data);
      },
      renderTimeline(phases) {
        const timeline = document.getElementById("timeline");
        timeline.innerHTML = phases.map(phase => `
          <div class="timeline-item">
            <div class="timeline-content">
              <div class="timeline-month">${phase.phase_name || ""}</div>
              <div class="timeline-description">${(phase.topics || []).join(", ")}</div>
              <div>
                ${(phase.topics || []).map(t => `<span class="timeline-topic">${t}</span>`).join("")}
              </div>
            </div>
          </div>`).join("");
      },
      renderSkills(phases) {
        const skillsGrid = document.getElementById("skillsGrid");
        let allSkills = [];
        const skillsPhase = phases.find(p => p.phase_name && p.phase_name.toLowerCase().includes("skill"));
        if (skillsPhase) allSkills = skillsPhase.topics;
        else allSkills = [...new Set(phases.flatMap(p=>p.topics||[]))].slice(0,6);
        skillsGrid.innerHTML = allSkills.map(skill => `
          <div class="skill-card">
            <div class="skill-icon"><i class="fas fa-code"></i></div>
            <div class="skill-name">${skill}</div>
            <div class="skill-level">Learning</div>
          </div>
        `).join("");
      },
      renderResources(phases, apiData) {
        const resourcesList = document.getElementById("resourcesList");
        let courses = (apiData && apiData.courses) ? apiData.courses : [];
        let books = (apiData && apiData.books) ? apiData.books : [];
        let projects = (apiData && apiData.projects) ? apiData.projects : [];

        const coursesPhase = phases.find(p => p.phase_name && /course/i.test(p.phase_name));
        const booksPhase = phases.find(p => p.phase_name && /book/i.test(p.phase_name));
        const projectsPhase = phases.find(p => p.phase_name && /project/i.test(p.phase_name));

        if ((!Array.isArray(courses) || courses.length === 0) && coursesPhase)
          courses = (coursesPhase.topics || []).map(name => ({ name }));

        if ((!Array.isArray(books) || books.length === 0) && booksPhase)
          books = (booksPhase.topics || []).map(title => ({ title }));

        if ((!Array.isArray(projects) || projects.length === 0) && projectsPhase)
          projects = projectsPhase.topics || [];

        let html = "";

        // Courses as Google search links
        if (courses.length > 0) {
          html += `<div style="font-weight:bold;margin-bottom:0.5em;color:var(--text-primary);">Courses</div>`;
          for (const course of courses) {
            const cname = course.name || course.title;
            if (cname) {
              const gsearch = encodeURIComponent(cname);
              html += `<div class="resource-item">
                <div class="resource-info">
                  <div class="resource-title">
                    <a href="https://www.google.com/search?q=${gsearch}" target="_blank" rel="noopener">${cname}</a>
                  </div>
                  <div class="resource-description">Course</div>
                </div>
              </div>`;
            }
          }
        }
        // Books with Google search link
        if (books.length > 0) {
          html += `<div style="font-weight:bold;margin:1em 0 0.5em 0;color:var(--text-primary);">Books</div>`;
          for (const book of books) {
            if (book.title) {
              const gsearch = encodeURIComponent(`${book.title||""} ${book.author||""}`);
              html += `<div class="resource-item">
                <div class="resource-info">
                  <div class="resource-title">
                    <a href="https://www.google.com/search?q=${gsearch}" target="_blank" rel="noopener">${book.title}</a>
                  </div>
                  <div class="resource-description">Book${book.author ? " by " + book.author : ""}</div>
                </div>
              </div>`;
            }
          }
        }
        // Projects as Google search links
        if (projects.length > 0) {
          html += `<div style="font-weight:bold;margin:1em 0 0.5em 0;color:var(--text-primary);">Projects</div>`;
          for (const proj of projects) {
            if (proj && typeof proj === "string") {
              const gsearch = encodeURIComponent(proj);
              html += `<div class="resource-item">
                <div class="resource-info">
                  <div class="resource-title">
                    <a href="https://www.google.com/search?q=${gsearch}" target="_blank" rel="noopener">${proj}</a>
                  </div>
                  <div class="resource-description">Project</div>
                </div>
              </div>`;
            }
          }
        }
        if (!html) {
          html = `<div><em>No learning resources found for this job.</em></div>`;
        }
        resourcesList.innerHTML = html;
      }
    };

    document.addEventListener('DOMContentLoaded', () => roadmapApp.init());
  </script>
</body>
</html>
