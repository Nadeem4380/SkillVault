<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SkillVault — Interactive Career Roadmaps</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f9fc;
      --bg-tertiary: #f0f5ff;
      --border-color: #e6eef9;
      --text-primary: #0f1724;
      --text-secondary: #64748b;
      --accent-primary: #0066ff;
      --accent-secondary: #00b7ff;
      --accent-tertiary: rgba(0,102,255,0.08);
      --success: #22c55e;
      --warning: #f59e0b;
      --transition: all 0.2s ease;
    }
    :root.dark-theme {
      --bg-primary: #0b1020;
      --bg-secondary: #071226;
      --bg-tertiary: #052033;
      --border-color: #122039;
      --text-primary: #e6eef9;
      --text-secondary: #9fb0c8;
      --accent-primary: #44a1ff;
      --accent-secondary: #6ce0ff;
      --accent-tertiary: rgba(100,160,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg-secondary); color: var(--text-primary); min-height: 100vh; }

    /* Header */
    .header { background: var(--bg-primary); border-bottom: 1px solid var(--border-color); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; gap: 1rem; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; }
    .logo i { font-size: 1.4rem; color: var(--accent-primary); }
    .logo h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-nav { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .nav-link { padding: .45rem .9rem; border-radius: .5rem; text-decoration: none; font-size: .85rem; font-weight: 600; color: var(--text-secondary); border: 1px solid var(--border-color); background: transparent; cursor: pointer; transition: var(--transition); }
    .nav-link:hover, .nav-link.active { color: var(--accent-primary); border-color: var(--accent-primary); background: var(--accent-tertiary); }
    .icon-btn { background: transparent; border: 1px solid var(--border-color); padding: .5rem; border-radius: .5rem; cursor: pointer; color: var(--text-primary); transition: var(--transition); }
    .icon-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

    /* Main */
    .main-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Hero */
    .page-hero { text-align: center; margin-bottom: 2.5rem; }
    .page-hero h2 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: .5rem; }
    .page-hero p { color: var(--text-secondary); font-size: 1rem; }

    /* Track Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .track-card { background: var(--bg-primary); border: 2px solid var(--border-color); border-radius: 1rem; padding: 1.25rem; cursor: pointer; transition: var(--transition); text-align: center; }
    .track-card:hover { border-color: var(--accent-primary); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,255,.12); }
    .track-card.active { border-color: var(--accent-primary); background: var(--accent-tertiary); }
    .track-icon { width: 52px; height: 52px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto .75rem; }
    .track-name { font-size: .9rem; font-weight: 700; margin-bottom: .25rem; }
    .track-desc { font-size: .75rem; color: var(--text-secondary); }
    .track-progress-bar { height: 4px; background: var(--border-color); border-radius: 2px; margin-top: .75rem; overflow: hidden; }
    .track-progress-fill { height: 100%; border-radius: 2px; transition: width .6s ease; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); }

    /* Roadmap Detail */
    .roadmap-detail { display: none; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 1rem; overflow: hidden; }
    .roadmap-detail.visible { display: block; }
    .roadmap-detail-header { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .roadmap-detail-header h2 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: .5rem; }
    .progress-info { display: flex; align-items: center; gap: 1rem; }
    .progress-badge { background: var(--accent-tertiary); color: var(--accent-primary); padding: .35rem .75rem; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .progress-bar-wrap { display: flex; align-items: center; gap: .75rem; }
    .progress-bar-container { width: 160px; height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); border-radius: 4px; transition: width .6s ease; }
    .close-roadmap-btn { background: transparent; border: 1px solid var(--border-color); padding: .4rem .8rem; border-radius: .5rem; cursor: pointer; color: var(--text-secondary); font-size: .85rem; display: flex; align-items: center; gap: .4rem; }
    .close-roadmap-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

    /* Phases */
    .phases-container { padding: 1.5rem; }
    .phase-block { margin-bottom: 1.5rem; border: 1px solid var(--border-color); border-radius: .75rem; overflow: hidden; }
    .phase-header { padding: 1rem 1.25rem; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: var(--transition); }
    .phase-header:hover { background: var(--accent-tertiary); }
    .phase-header-left { display: flex; align-items: center; gap: .75rem; }
    .phase-badge { padding: .3rem .7rem; border-radius: 999px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .phase-badge.beginner { background: rgba(34,197,94,.15); color: #15803d; }
    .phase-badge.intermediate { background: rgba(245,158,11,.15); color: #b45309; }
    .phase-badge.advanced { background: rgba(239,68,68,.15); color: #b91c1c; }
    :root.dark-theme .phase-badge.beginner { color: #4ade80; }
    :root.dark-theme .phase-badge.intermediate { color: #fbbf24; }
    :root.dark-theme .phase-badge.advanced { color: #f87171; }
    .phase-title { font-weight: 700; font-size: .95rem; }
    .phase-meta { font-size: .8rem; color: var(--text-secondary); }
    .phase-chevron { font-size: .9rem; color: var(--text-secondary); transition: transform .2s ease; }
    .phase-header.expanded .phase-chevron { transform: rotate(180deg); }
    .phase-progress { font-size: .78rem; color: var(--accent-primary); font-weight: 600; background: var(--accent-tertiary); padding: .2rem .5rem; border-radius: 999px; }

    .phase-content { display: none; padding: 1.25rem; border-top: 1px solid var(--border-color); }
    .phase-content.open { display: block; }

    /* Skills in phase */
    .phase-skills { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
    .phase-skill-tag { padding: .25rem .6rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 999px; font-size: .78rem; font-weight: 600; color: var(--text-secondary); }

    /* Steps */
    .steps-list { list-style: none; }
    .step-item { display: flex; align-items: flex-start; gap: .75rem; padding: .75rem; border-radius: .5rem; margin-bottom: .5rem; transition: var(--transition); cursor: pointer; border: 1px solid transparent; }
    .step-item:hover { background: var(--bg-secondary); border-color: var(--border-color); }
    .step-item.completed { background: rgba(34,197,94,.06); border-color: rgba(34,197,94,.2); }
    .step-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition); background: var(--bg-primary); margin-top: .1rem; }
    .step-item.completed .step-checkbox { background: var(--success); border-color: var(--success); color: white; }
    .step-checkbox i { font-size: .65rem; }
    .step-text { flex: 1; }
    .step-name { font-size: .88rem; font-weight: 600; margin-bottom: .2rem; }
    .step-item.completed .step-name { text-decoration: line-through; color: var(--text-secondary); }
    .step-detail { font-size: .78rem; color: var(--text-secondary); line-height: 1.5; }

    /* Resources */
    .resources-block { margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border-color); }
    .resources-title { font-size: .8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .6rem; }
    .resource-links { display: flex; flex-wrap: wrap; gap: .4rem; }
    .resource-link { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .65rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: .4rem; font-size: .78rem; color: var(--text-secondary); text-decoration: none; transition: var(--transition); cursor: pointer; }
    .resource-link:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

    /* Toast */
    .toast { position: fixed; right: 1rem; bottom: 1rem; background: rgba(12,20,40,.92); color: #fff; padding: .65rem 1rem; border-radius: .5rem; font-weight: 600; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; z-index: 9999; pointer-events: none; font-size: .88rem; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Search */
    .search-bar { position: relative; max-width: 400px; margin: 0 auto 2rem; }
    .search-bar input { width: 100%; padding: .75rem 1rem .75rem 2.75rem; border: 1px solid var(--border-color); border-radius: .75rem; background: var(--bg-primary); color: var(--text-primary); font-size: .9rem; transition: var(--transition); }
    .search-bar input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-tertiary); }
    .search-bar i { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

    @media(max-width: 600px) {
      .track-grid { grid-template-columns: repeat(2, 1fr); }
      .progress-bar-container { width: 100px; }
      .page-hero h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">
        <i class="fas fa-vault"></i>
        <h1>SkillVault</h1>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="resume-builder.html" class="nav-link">Resume Builder</a>
        <a href="ats-checker.html" class="nav-link">ATS Checker</a>
        <a href="interactive-roadmap.html" class="nav-link active">Roadmaps</a>
        <a href="portfolio.html" class="nav-link">Portfolio</a>
      </nav>
      <div>
        <button id="themeToggle" class="icon-btn" title="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
    </div>

  <main class="main-container">
    <div class="page-hero">
      <h2><i class="fas fa-map-marked-alt"></i> Interactive Career Roadmaps</h2>
      <p>Choose your career path and follow a step-by-step learning journey. Track your progress as you go.</p>
    </div>

    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="trackSearch" placeholder="Search career tracks..." />
    </div>

    <div class="track-grid" id="trackGrid">
      <!-- Rendered by JS -->
    </div>

    <div class="roadmap-detail" id="roadmapDetail">
      <div class="roadmap-detail-header">
        <h2 id="detailTitle"><i class="fas fa-map"></i> Roadmap</h2>

            <span style="font-size:.8rem;color:var(--text-secondary)">Progress:</span>
            <div class="progress-bar-container">

            <span class="progress-badge" id="progressPct">0%</span>
          </div>
          <button class="close-roadmap-btn" id="closeRoadmapBtn"><i class="fas fa-times"></i> Close</button>
        </div>
      </div>
      <div class="phases-container" id="phasesContainer">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    // ─── Theme ─────────────────────────────────────────────────────────────────
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('skillvault-theme') === 'dark') {
      document.documentElement.classList.add('dark-theme');
      themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark-theme');
      localStorage.setItem('skillvault-theme', dark ? 'dark' : 'light');
      themeToggle.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ─── Progress storage ────────────────────────────────────────────────────────
    function loadProgress() {
      return JSON.parse(localStorage.getItem('sv-roadmap-progress') || '{}');
    }
    function saveProgress(progress) {
      localStorage.setItem('sv-roadmap-progress', JSON.stringify(progress));
    }

    function getTrackProgress(trackId) {
      const progress = loadProgress();
      const track = tracks.find(t => t.id === trackId);
      if (!track) return 0;
      const totalSteps = track.phases.reduce((sum, p) => sum + p.steps.length, 0);
      const completed = track.phases.reduce((sum, p, pi) =>
        sum + p.steps.filter((_, si) => progress[`${trackId}_${pi}_${si}`]).length, 0
      );
      return totalSteps > 0 ? Math.round((completed / totalSteps) * 100) : 0;
    }

    function isStepDone(trackId, phaseIdx, stepIdx) {
      const progress = loadProgress();
      return !!progress[`${trackId}_${phaseIdx}_${stepIdx}`];
    }

    function toggleStep(trackId, phaseIdx, stepIdx) {
      const progress = loadProgress();
      const key = `${trackId}_${phaseIdx}_${stepIdx}`;
      progress[key] = !progress[key];
      saveProgress(progress);
    }

    // ─── Render track grid ───────────────────────────────────────────────────────
    let currentTrackId = null;

    function renderTrackGrid(filter = '') {
      const grid = document.getElementById('trackGrid');
      const filtered = tracks.filter(t =>
        t.name.toLowerCase().includes(filter.toLowerCase()) ||
        t.desc.toLowerCase().includes(filter.toLowerCase())
      );
      grid.innerHTML = filtered.map(track => {
        const pct = getTrackProgress(track.id);
        return `
          <div class="track-card ${currentTrackId === track.id ? 'active' : ''}" data-id="${track.id}">
            <div class="track-icon" style="background:${track.iconBg}">
              <i class="${track.icon}" style="color:${track.iconColor}"></i>
            </div>
            <div class="track-name">${track.name}</div>
            <div class="track-desc">${track.desc}</div>
            <div class="track-progress-bar">
              <div class="track-progress-fill" style="width:${pct}%"></div>
            </div>
            <div style="text-align:center;font-size:.72rem;color:var(--text-secondary);margin-top:.3rem">${pct}% complete</div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.track-card').forEach(card => {
        card.addEventListener('click', () => openTrack(card.dataset.id));
      });
    }

    // ─── Open a track ────────────────────────────────────────────────────────────
    function openTrack(trackId) {
      currentTrackId = trackId;
      const track = tracks.find(t => t.id === trackId);
      if (!track) return;

      renderTrackGrid();

      const detail = document.getElementById('roadmapDetail');
      detail.classList.add('visible');
      document.getElementById('detailTitle').innerHTML = `<i class="${track.icon}" style="color:${track.iconColor}"></i> ${track.name} Roadmap`;

      renderPhases(track);
      updateOverallProgress(track);

      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updateOverallProgress(track) {
      const pct = getTrackProgress(track.id);
      document.getElementById('overallProgress').style.width = `${pct}%`;
      document.getElementById('progressPct').textContent = `${pct}%`;
    }

    function renderPhases(track) {
      const container = document.getElementById('phasesContainer');
      container.innerHTML = track.phases.map((phase, pi) => {
        const totalSteps = phase.steps.length;
        const completedSteps = phase.steps.filter((_, si) => isStepDone(track.id, pi, si)).length;
        const phaseCompletion = `${completedSteps}/${totalSteps}`;
        const isFirst = pi === 0;

        return `
          <div class="phase-block">
            <div class="phase-header ${isFirst ? 'expanded' : ''}" data-phase="${pi}">
              <div class="phase-header-left">
                <span class="phase-badge ${phase.level}">${phase.level}</span>
                <div>
                  <div class="phase-title">${phase.title}</div>
                  <div class="phase-meta"><i class="fas fa-clock"></i> ${phase.duration}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:.75rem">
                <span class="phase-progress">${phaseCompletion} done</span>
                <i class="fas fa-chevron-down phase-chevron ${isFirst ? '' : 'rotated'}"></i>
              </div>
            </div>
            <div class="phase-content ${isFirst ? 'open' : ''}" data-phase-content="${pi}">
              <div class="phase-skills">${phase.skills.map(s => `<span class="phase-skill-tag">${s}</span>`).join('')}</div>
              <ul class="steps-list">
                ${phase.steps.map((step, si) => `
                  <li class="step-item ${isStepDone(track.id, pi, si) ? 'completed' : ''}" data-phase="${pi}" data-step="${si}">
                    <div class="step-checkbox">
                      ${isStepDone(track.id, pi, si) ? '<i class="fas fa-check"></i>' : ''}
                    </div>
                    <div class="step-text">
                      <div class="step-name">${step.name}</div>
                      <div class="step-detail">${step.detail}</div>
                    </div>
                  </li>
                `).join('')}
              </ul>
              <div class="resources-block">
                <div class="resources-title"><i class="fas fa-book-open"></i> Recommended Resources</div>
                <div class="resource-links">
                  ${phase.resources.map(r => `<span class="resource-link"><i class="fas fa-external-link-alt"></i> ${r}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Phase toggle
      container.querySelectorAll('.phase-header').forEach(header => {
        header.addEventListener('click', () => {
          const pi = header.dataset.phase;
          const content = container.querySelector(`[data-phase-content="${pi}"]`);
          const chevron = header.querySelector('.phase-chevron');
          const isOpen = content.classList.contains('open');
          content.classList.toggle('open', !isOpen);
          header.classList.toggle('expanded', !isOpen);
        });
      });

      // Step toggle
      container.querySelectorAll('.step-item').forEach(item => {
        item.addEventListener('click', () => {
          const pi = parseInt(item.dataset.phase);
          const si = parseInt(item.dataset.step);
          toggleStep(track.id, pi, si);
          const done = isStepDone(track.id, pi, si);
          item.classList.toggle('completed', done);
          const checkbox = item.querySelector('.step-checkbox');
          checkbox.innerHTML = done ? '<i class="fas fa-check"></i>' : '';
          updatePhaseProgress(track, pi);
          updateOverallProgress(track);
          renderTrackGrid();
          showToast(done ? '✅ Step completed!' : '↩️ Step marked incomplete');
        });
      });
    }

    function updatePhaseProgress(track, pi) {
      const phase = track.phases[pi];
      const completed = phase.steps.filter((_, si) => isStepDone(track.id, pi, si)).length;
      const progressEl = document.querySelector(`.phase-header[data-phase="${pi}"] .phase-progress`);
      if (progressEl) progressEl.textContent = `${completed}/${phase.steps.length} done`;
    }

    // Close roadmap
    document.getElementById('closeRoadmapBtn').addEventListener('click', () => {
      document.getElementById('roadmapDetail').classList.remove('visible');
      currentTrackId = null;
      renderTrackGrid();
    });

    // Search
    document.getElementById('trackSearch').addEventListener('input', e => {
      renderTrackGrid(e.target.value);
    });

    // ─── Init ────────────────────────────────────────────────────────────────────
    renderTrackGrid();
  </script>
