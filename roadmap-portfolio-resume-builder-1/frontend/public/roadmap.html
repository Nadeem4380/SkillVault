<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/roadmap.js" defer></script>
</head>
<body>
    <header>
        <h1>Your Learning Roadmap</h1>
    </header>
    <main>
        <section id="roadmap-container">
            <h2>Personalized Roadmap</h2>
            <div id="progress-tracker">
                <h3>Progress Tracker</h3>
                <div class="milestone" id="milestone-1">
                    <h4>Milestone 1</h4>
                    <div class="progress-bar">
                        <div class="progress" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="milestone" id="milestone-2">
                    <h4>Milestone 2</h4>
                    <div class="progress-bar">
                        <div class="progress" style="width: 0%;"></div>
                    </div>
                </div>
                <!-- Add more milestones as needed -->
            </div>
            <div id="learning-resources">
                <h3>Recommended Learning Resources</h3>
                <ul>
                    <li>
                        <a href="#" class="resource-link">
                            <img src="resource-thumbnail.jpg" alt="Resource Thumbnail">
                            <p>Resource Title</p>
                        </a>
                    </li>
                    <!-- Add more resources as needed -->
                </ul>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Roadmap Portfolio Resume Builder</p>
    </footer>
</body>
</html>
