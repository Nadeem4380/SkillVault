<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header>
        <h1>Create Your Portfolio</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="roadmap.html">Roadmap</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="portfolio-form">
            <h2>Add a New Project</h2>
            <form id="projectForm">
                <label for="title">Project Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>

                <label for="techStack">Tech Stack:</label>
                <input type="text" id="techStack" name="techStack" required>

                <label for="githubLink">GitHub Link:</label>
                <input type="url" id="githubLink" name="githubLink">

                <label for="demoLink">Demo Link:</label>
                <input type="url" id="demoLink" name="demoLink">

                <label for="projectImage">Project Image:</label>
                <input type="file" id="projectImage" name="projectImage" accept="image/*">

                <button type="submit">Add Project</button>
            </form>
        </section>
        <section id="portfolio-display">
            <h2>Your Projects</h2>
            <div id="projectsList"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Roadmap Portfolio Resume Builder</p>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/portfolio.js"></script>
</body>
</html>
